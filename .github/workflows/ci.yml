name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: swift test
      - run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: macSlider.app, path: build/macSlider.app }
